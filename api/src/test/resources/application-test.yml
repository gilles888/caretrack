spring:
  datasource:
    url: jdbc:h2:mem:caretrack_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 1025
    username:
    password:
logging:
  level:
    com.caretrack: WARN
    org.hibernate: WARN
caretrack:
  app-url: http://localhost:4200
  notifications:
    email-enabled: false
    digest-delay-minutes: 60
    from-address: noreply@caretrack.fr
  alertes:
    retard-jours-warning: 2
    retard-jours-critical: 5
