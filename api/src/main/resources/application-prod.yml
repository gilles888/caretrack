# Profil production — PostgreSQL 15
# Sera complété en Phase 2 (prompt P-11)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 25

  h2:
    console:
      enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8083

logging:
  level:
    com.caretrack: INFO
    root: WARN

app:
  security:
    jwt:
      secret: ${JWT_SECRET}          # Obligatoire en production — variable d'environnement
      expiration: ${JWT_EXPIRATION:86400}
