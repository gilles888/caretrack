# Profil production — PostgreSQL 15
# Sera complété en Phase 2 (prompt P-11)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 25

  h2:
    console:
      enabled: false

  flyway:
    enabled: false

server:
  port: 8083

logging:
  level:
    com.caretrack: INFO
    root: WARN
